/* 与 forum.html 一致：用户关过毛玻璃就把 glass-off 打在最前面，避免首屏闪一下磨砂。 */
(function () {
    try {
        var s = JSON.parse(localStorage.getItem('chatSettings') || '{}');
        if (s.glassEffectEnabled === false) document.documentElement.classList.add('glass-off');
    } catch (e) {}
})();
</script>

<body class="market-page">
<script>
/* 浅色 / 绝区零主题沿用主站的 themeMode，必须在首屏内容前贴到 body 上，否则会闪一下深色。
   （star 星铁两档这里不挂皮，按下面对应的深浅档渲染即可） */
(function () {
    try {
        var m = localStorage.getItem('themeMode');
        if (m === 'light' || m === 'sr') document.body.classList.add('light-theme');
        if (m === 'zzz') document.body.classList.add('zzz-theme');
    } catch (e) {}
})();
</script>

<header class="market-topbar">

</header>

<main class="market-main">
    <div class="market-tabs" role="tablist" aria-label="角色卡市场视图">
        <button class="market-tab active" type="button" role="tab" data-tab="mine"><i class="ri-user-3-line"></i> 我的角色 <em id="tab-count-mine">0</em></button>
        <button class="market-tab" type="button" role="tab" data-tab="market"><i class="ri-store-2-line"></i> 角色卡市场 <em id="tab-count-market">0</em></button>
        <button class="market-tab" type="button" role="tab" data-tab="groups"><i class="ri-folder-3-line"></i> 分组管理</button>
    </div>

    <p class="market-tip" id="market-tip">
        <i class="ri-information-line"></i>
        角色提示词只在「你点进某个角色的聊天」时才加载。没添加、没用到的角色，它的设定根本不会被下载，也不会占用你的上下文。
    </p>

    <!-- ============ 我的角色 ============ -->
    <section class="market-panel" data-panel="mine">
        <div class="market-toolbar">
            <label class="market-search"><i class="ri-search-line"></i><input type="search" id="mine-search" placeholder="搜索角色名 / 备注 / 分组" aria-label="搜索我的角色"></label>
            <select id="mine-group" aria-label="按分组筛选"></select>
            <select id="mine-sort" aria-label="排序方式">
                <option value="recent">最近聊过</option>
                <option value="name">按名称</option>
                <option value="group">按分组</option>
                <option value="added">添加顺序</option>
            </select>
            <button class="market-ghost" type="button" id="mine-restore-btn" hidden title="把移出主站的角色加回来"><i class="ri-arrow-go-back-line"></i> 恢复移出 <em id="mine-restore-count">0</em></button>
            <button class="market-ghost" type="button" id="mine-select-all"><i class="ri-checkbox-multiple-line"></i> 全选</button>
            <button class="market-ghost" type="button" id="mine-clear-sel" hidden><i class="ri-close-line"></i> 取消选择</button>
        </div>
        <div class="market-batchbar" id="mine-batchbar" hidden>
            <span class="market-batch-count">已选 <b id="mine-sel-count">0</b> 个</span>
            <button class="market-ghost" type="button" data-batch="group"><i class="ri-folder-transfer-line"></i> 移动到分组</button>
            <button class="market-ghost" type="button" data-batch="newgroup"><i class="ri-folder-add-line"></i> 新建分组并移入</button>
            <button class="market-ghost" type="button" data-batch="groupchat"><i class="ri-group-line"></i> 开启群聊</button>
            <button class="market-ghost" type="button" data-batch="remove"><i class="ri-user-unfollow-line"></i> 移出主站</button>
            <button class="market-ghost danger" type="button" data-batch="delete"><i class="ri-delete-bin-2-line"></i> 彻底删除</button>
        </div>
        <div class="market-grid" id="mine-grid" role="list"></div>
    </section>

    <!-- ============ 角色卡市场 ============ -->
    <section class="market-panel" data-panel="market" hidden>
        <div class="market-toolbar">
            <label class="market-search"><i class="ri-search-line"></i><input type="search" id="market-search" placeholder="搜索角色名 / 作品 / 标签" aria-label="搜索角色卡"></label>
            <select id="market-source" aria-label="按来源筛选">
                <option value="all">全部来源</option>
                <option value="preset">预置角色卡</option>
                <option value="builtin">站内内置</option>
            </select>
            <select id="market-work" aria-label="按作品筛选">
                <option value="all">全部作品</option>
            </select>
            <select id="market-sort" aria-label="排序方式">
                <option value="hot">推荐优先</option>
                <option value="name">按名称</option>
                <option value="size">按角色卡大小</option>
            </select>
            <button class="market-ghost" type="button" id="market-check-updates"><i class="ri-refresh-line"></i> 检查更新<em id="market-update-count" hidden>0</em></button>
            <button class="market-ghost" type="button" id="market-open-site"><i class="ri-add-circle-line"></i> 自制角色卡</button>
        </div>
        <div class="market-grid" id="market-grid" role="list"></div>
    </section>

    <!-- ============ 分组管理 ============ -->
    <section class="market-panel" data-panel="groups" hidden>
        <div class="market-toolbar">
            <button class="market-ghost" type="button" id="group-add"><i class="ri-folder-add-line"></i> 新建分组</button>
            <span class="market-hint" id="group-hint">分组与主站共用：这里改动后，短信里的角色列表会立刻跟着变。</span>
        </div>
        <div class="market-group-list" id="group-list"></div>
    </section>
</main>

<div class="market-modal" id="market-modal" hidden>
    <div class="market-dialog" role="dialog" aria-modal="true">
        <button class="market-dialog-close" id="market-modal-close" type="button" aria-label="关闭"><i class="ri-close-line"></i></button>

        <div class="market-dialog-body" id="market-modal-body"></div>
