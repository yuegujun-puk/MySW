<!-- 主题引导：论坛是独立页面，不加载 mysw-core.js，所以这里自己读一次
     themeMode 并把 body 类名挂好（与主站 applyThemeMode 的映射完全一致，
     主站切完主题跳转到论坛不会有任何色差）。
     6 种取值：dark 深色 / light 浅色 / sr 星铁·浅 / sr-dark 星铁·深 / zzz 绝区零 / custom 自定义 -->
<script>(function(){try{var m=localStorage.getItem('themeMode')||'dark';var b=document.body;var t=null;if(m==='custom'){try{t=JSON.parse(localStorage.getItem('myCustomTheme')||'null');}catch(e){t=null;}if(t&&t.base==='light')b.classList.add('light-theme');b.classList.add('custom-theme');}else{b.classList.toggle('light-theme',m==='light'||m==='sr');}b.classList.toggle('sr-theme',m==='sr'||m==='sr-dark');b.classList.toggle('sr-dark-theme',m==='sr-dark');b.classList.toggle('zzz-theme',m==='zzz');document.documentElement.setAttribute('data-theme-mode',m);if(m==='custom'){function H(v){return typeof v==='string'&&/^#[0-9a-f]{3,8}$/i.test(v)?v:'';}var v=t&&t.vars||{};var css='body.custom-theme{';var map={'--forum-bg':H(v.bgPrimary),'--forum-panel':H(v.bgSecondary),'--forum-panel2':H(v.bgTertiary),'--forum-text':H(v.textPrimary),'--forum-muted':H(v.textSecondary),'--forum-gold':H(v.accent)};for(var k in map){if(map[k])css+=k+':'+map[k]+';';}css+='}';if(css.length>24){var st=document.createElement('style');st.id='forum-custom-theme-style';st.textContent=css;document.head.appendChild(st);}}}catch(e){}})();</script>

/* 论坛主题切换（六态循环，与主站 #theme-toggle-btn 同一套顺序与类名）：
   深色 → 浅色 → 星铁·浅 → 星铁·深 → 绝区零 → 自定义 → 深色
   结果写回 localStorage.themeMode，主站/下次打开会自动沿用它。
   自定义主题的「工坊」在主站设置页里；论坛循环到 custom 但还没有
   搓过主题时自动跳过（并提示去主站创建），避免切到一个空主题。 */
(function () {
    var ORDER = ['dark', 'light', 'sr', 'sr-dark', 'zzz', 'custom'];
    var LABELS = { dark: '深色', light: '浅色', sr: '星铁·浅', 'sr-dark': '星铁·深', zzz: '绝区零', custom: '自定义' };
    var btn = document.getElementById('forum-theme');
    var label = document.getElementById('forum-theme-label');
    if (!btn) return;
    function H(v) { return typeof v === 'string' && /^#[0-9a-f]{3,8}$/i.test(v) ? v : ''; }
    /* 把自定义主题的配色映射到论坛自己的变量上（--forum-*），并挂/撤 custom-theme 类 */
    function applyCustom(mode) {
        var b = document.body;
        var old = document.getElementById('forum-custom-theme-style');
        if (old) old.remove();
        if (mode !== 'custom') return;
        var t = null;
        try { t = JSON.parse(localStorage.getItem('myCustomTheme') || 'null'); } catch (e) { t = null; }
        b.classList.toggle('light-theme', !!(t && t.base === 'light'));
        b.classList.add('custom-theme');
        var v = (t && t.vars) || {};
        var map = { '--forum-bg': H(v.bgPrimary), '--forum-panel': H(v.bgSecondary), '--forum-panel2': H(v.bgTertiary), '--forum-text': H(v.textPrimary), '--forum-muted': H(v.textSecondary), '--forum-gold': H(v.accent) };
        var css = 'body.custom-theme{';
        for (var k in map) { if (map[k]) css += k + ':' + map[k] + ';'; }
        css += '}';
        if (css.length > 24) {
            var st = document.createElement('style');
            st.id = 'forum-custom-theme-style';
            st.textContent = css;
            document.head.appendChild(st);
        }
    }
    function apply(mode) {
        var b = document.body;
        b.classList.toggle('light-theme', mode === 'light' || mode === 'sr');
        b.classList.toggle('sr-theme', mode === 'sr' || mode === 'sr-dark');
        b.classList.toggle('sr-dark-theme', mode === 'sr-dark');
        b.classList.toggle('zzz-theme', mode === 'zzz');
        b.classList.toggle('custom-theme', mode === 'custom');
        applyCustom(mode); // custom 时注入变量；非 custom 时只负责清掉之前注入的样式
        document.documentElement.setAttribute('data-theme-mode', mode);
        if (label) label.textContent = LABELS[mode] || mode;
    }
    var current = localStorage.getItem('themeMode') || 'dark';
    apply(current);
    btn.addEventListener('click', function () {
        var next = ORDER[(ORDER.indexOf(current) + 1) % ORDER.length] || 'dark';
        if (next === 'custom' && !readCustomHasTheme()) next = 'dark'; // 没搓过主题就跳过
        current = next;
        try { localStorage.setItem('themeMode', next); } catch (e) {}
        apply(next);
    });
    function readCustomHasTheme() {
        try {
            var t = JSON.parse(localStorage.getItem('myCustomTheme') || 'null');
            return !!(t && t.vars && Object.keys(t.vars).length);
        } catch (e) { return false; }
    }
})();
</script></body></html>
