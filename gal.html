<!DOCTYPE html>
<html lang="zh-CN" class="gal-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GAL 工作室 · 视觉小说制作 · My SW</title>
    <meta name="description" content="My SW GAL 工作室：在浏览器里写视觉小说。节点式剧本、立绘与背景、选项分支与变量、存读档与回顾，做完一键导出成能独立运行的单个 HTML 文件。">
    <link rel="canonical" href="https://mysw-yg.pages.dev/gal.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="My SW">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:title" content="GAL 工作室 · 视觉小说制作">
    <meta property="og:description" content="节点式剧本、立绘、分支与变量、存读档，一键导出可独立运行的单文件 HTML。">
    <meta property="og:url" content="https://mysw-yg.pages.dev/gal.html">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
    <link rel="stylesheet" href="mysw-core.css">
    <link rel="stylesheet" href="gal.css">
    <script>
    (function () {
        try {
            var s = JSON.parse(localStorage.getItem('chatSettings') || '{}');
            if (s.glassEffectEnabled === false) document.documentElement.classList.add('glass-off');
        } catch (e) {}
    })();
    </script>
</head>
<body class="gal-page" data-mtab="stage">

<!-- ============================================================
     顶栏
     ============================================================ -->
<header class="gal-top">
    <a class="gal-back" href="index.html" title="返回聊天"><i class="ri-arrow-left-line"></i><span>返回</span></a>
    <div class="gal-brand"><i class="ri-book-2-line"></i><b>GAL 工作室</b></div>
    <input id="gal-project-title" class="gal-project-title" value="未命名作品" spellcheck="false" maxlength="60" aria-label="作品名">

    <div class="gal-top-actions">
        <button type="button" class="gal-btn icon" id="gal-undo" title="撤销（Ctrl+Z）" disabled><i class="ri-arrow-go-back-line"></i></button>
        <button type="button" class="gal-btn icon" id="gal-redo" title="重做（Ctrl+Y）" disabled><i class="ri-arrow-go-forward-line"></i></button>
        <button type="button" class="gal-btn" id="gal-ai-btn" title="把你写好的剧本丢进来，拆成能点着玩的节点"><i class="ri-magic-line"></i><span>剧本转 GAL</span></button>
        <button type="button" class="gal-btn" id="gal-preview" title="用真实播放器试玩当前剧本"><i class="ri-play-circle-line"></i><span>试玩</span></button>
        <button type="button" class="gal-btn primary" id="gal-export" title="导出为单个 HTML 文件"><i class="ri-download-2-line"></i><span>导出 HTML</span></button>
        <button type="button" class="gal-btn icon" id="gal-menu-btn" title="更多操作"><i class="ri-more-2-line"></i></button>
    </div>

    <div class="gal-menu" id="gal-menu" hidden>
        <button type="button" data-cmd="save"><i class="ri-save-3-line"></i>保存到浏览器<em>Ctrl+S</em></button>
        <button type="button" data-cmd="new"><i class="ri-file-add-line"></i>新建作品</button>
        <button type="button" data-cmd="open"><i class="ri-folder-open-line"></i>打开作品…</button>
        <button type="button" data-cmd="duplicate"><i class="ri-file-copy-2-line"></i>复制当前作品</button>
        <button type="button" data-cmd="import"><i class="ri-upload-2-line"></i>导入工程 JSON…</button>
        <button type="button" data-cmd="export-json"><i class="ri-file-code-line"></i>导出工程 JSON</button>
        <button type="button" data-cmd="export-all"><i class="ri-archive-2-line"></i>导出全部作品</button>
        <div class="gal-menu-sep"></div>
        <button type="button" data-cmd="stats"><i class="ri-bar-chart-2-line"></i>作品统计</button>
        <button type="button" data-cmd="keys"><i class="ri-keyboard-line"></i>快捷键与语法</button>
        <button type="button" data-cmd="clear" class="danger"><i class="ri-delete-bin-6-line"></i>清空剧本</button>
        <div class="gal-menu-sep"></div>
        <button type="button" data-cmd="docs"><i class="ri-book-open-line"></i>打开使用文档</button>
    </div>
</header>

<!-- ============================================================
     主体：三栏
     ============================================================ -->
<main class="gal-main">

    <!-- ---------- 左：剧本 ---------- -->
    <aside class="gal-col gal-col-left">
        <div class="gal-col-head">
            <span><i class="ri-list-check-2"></i> 剧本</span>
            <span class="gal-chip" id="gal-node-count">0</span>
        </div>
        <div class="gal-nodes" id="gal-nodes" role="listbox" aria-label="剧本节点"></div>
        <div class="gal-add-dock">
            <button type="button" class="gal-add-main" id="gal-add-btn"><i class="ri-add-line"></i> 添加节点</button>
            <div class="gal-add-grid" id="gal-add-grid" hidden></div>
        </div>
    </aside>

    <!-- ---------- 中：舞台 + 检查器 ---------- -->
    <section class="gal-col gal-col-center">
        <div class="gal-stage-head">
            <span class="gal-stage-tag" id="gal-stage-tag"><i class="ri-eye-line"></i> 预览</span>
            <select class="gal-select sm" id="gal-stage-ratio" aria-label="预览比例">
                <option value="16/9">16 : 9</option>
                <option value="4/3">4 : 3</option>
                <option value="9/16">9 : 16（手机）</option>
                <option value="3/4">3 : 4（平板）</option>
            </select>
            <span class="gal-flex"></span>
            <button type="button" class="gal-mini" id="gal-stage-restart" title="回到第一个节点"><i class="ri-skip-back-mini-line"></i> 从头</button>
            <button type="button" class="gal-mini" id="gal-stage-play" title="从这个节点开始试玩"><i class="ri-play-mini-line"></i> 此处试玩</button>
        </div>
        <div class="gal-stage-box" id="gal-stage-box">
            <div class="gv-root gal-stage" id="gal-stage"></div>
        </div>
        <div class="gal-inspector" id="gal-inspector"></div>
    </section>

    <!-- ---------- 右：属性 ---------- -->
    <aside class="gal-col gal-col-right">
        <div class="gal-tabs" role="tablist">
            <button type="button" data-tab="proj" class="on" title="作品设置"><i class="ri-settings-3-line"></i><span>作品</span></button>
            <button type="button" data-tab="chars" title="角色"><i class="ri-group-2-line"></i><span>角色</span></button>
            <button type="button" data-tab="assets" title="素材"><i class="ri-image-2-line"></i><span>素材</span></button>
            <button type="button" data-tab="vars" title="变量"><i class="ri-code-s-slash-line"></i><span>变量</span></button>
        </div>
        <div class="gal-panes">
            <div class="gal-pane on" data-pane="proj" id="gal-pane-proj"></div>
            <div class="gal-pane" data-pane="chars" id="gal-pane-chars"></div>
            <div class="gal-pane" data-pane="assets" id="gal-pane-assets"></div>
            <div class="gal-pane" data-pane="vars" id="gal-pane-vars"></div>
        </div>
    </aside>
</main>

<!-- 手机端栏切换 -->
<nav class="gal-mtab" role="tablist">
    <button type="button" data-mtab="script"><i class="ri-list-check-2"></i><span>剧本</span></button>
    <button type="button" data-mtab="stage" class="on"><i class="ri-eye-line"></i><span>舞台</span></button>
    <button type="button" data-mtab="props"><i class="ri-settings-3-line"></i><span>属性</span></button>
</nav>

<!-- 状态栏 -->
<footer class="gal-status">
    <span id="gal-status-save" class="gal-status-dot"><i class="ri-shield-check-line"></i> 已保存</span>
    <span class="gal-sep">·</span>
    <span id="gal-status-stat">0 节点 / 0 字</span>
    <span class="gal-sep">·</span>
    <span id="gal-status-size">0 KB</span>
    <span class="gal-flex"></span>
    <span class="gal-status-hint" id="gal-status-hint">选中节点后在这里编辑</span>
</footer>

<!-- 通用弹窗 -->
<div class="gal-modal" id="gal-modal" hidden>
    <div class="gal-modal-box" role="dialog" aria-modal="true">
        <div class="gal-modal-head">
            <h3 id="gal-modal-title">标题</h3>
            <button type="button" class="gal-modal-x" id="gal-modal-x"><i class="ri-close-line"></i></button>
        </div>
        <div class="gal-modal-body" id="gal-modal-body"></div>
        <div class="gal-modal-foot" id="gal-modal-foot"></div>
    </div>
</div>

<div class="gal-toast" id="gal-toast" hidden></div>
<input type="file" id="gal-file" accept=".json,application/json" hidden>

<!-- ============================================================
     播放器样式：导出时会整段内嵌进产物 HTML。
     编辑器里的舞台预览也直接用这套类，所见即所得。
     全部 gv- 前缀，避免和站点样式撞名。
     ============================================================ -->
<style id="gv-player-css">
.gv-root{
    position:fixed; inset:0; overflow:hidden; background:#07080b; color:#e9e9ee;
    font-family:var(--gv-font,"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif);
    -webkit-tap-highlight-color:transparent; user-select:none; touch-action:manipulation;
    line-height:1.7;
}
.gv-root *{box-sizing:border-box}
.gv-app{
    position:absolute; inset:0; overflow:hidden;
    font-size:calc(var(--gv-fs, 16px) * var(--gv-scale, 1));
    line-height:1.7;
}

/* ---------- 背景：双层交叉淡入 ---------- */
.gv-bgs{position:absolute;inset:0;overflow:hidden}
.gv-bg{
    position:absolute;inset:0;background-position:center center;background-size:cover;
    background-color:#0a0b0f;opacity:0;transition:opacity .7s ease;will-change:opacity,transform;
}
.gv-bg.on{opacity:1}
.gv-bg.kb{animation:gvKenBurns 30s ease-in-out infinite alternate}
@keyframes gvKenBurns{from{transform:scale(1.02)}to{transform:scale(1.11)}}
.gv-bg.blank{
    background-image:
      radial-gradient(95% 75% at 24% 10%, rgba(230,199,138,.20), transparent 56%),
      radial-gradient(95% 75% at 80% 88%, rgba(110,140,220,.24), transparent 58%),
      linear-gradient(160deg,#242938 0%,#161a29 55%,#0b0d16 100%);
}
.gv-dim{position:absolute;inset:0;background:#000;opacity:var(--gv-dim,.18);pointer-events:none}
.gv-vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 40%, transparent 42%, rgba(0,0,0,.46) 100%)}
.gv-mood{position:absolute;inset:0;pointer-events:none;transition:background .8s ease;background:transparent}

/* ---------- 立绘 ---------- */
.gv-sprites{position:absolute;inset:0;pointer-events:none}
.gv-sprite{
    position:absolute;bottom:0;height:96%;max-height:1100px;
    transform:translateX(-50%) translateY(3%) scale(.99);
    opacity:0;transition:opacity .38s ease, filter .38s ease, transform .46s cubic-bezier(.2,.9,.25,1);
    filter:drop-shadow(0 12px 34px rgba(0,0,0,.6));
}
.gv-sprite.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.gv-sprite.dim{filter:brightness(.62) saturate(.82) drop-shadow(0 12px 34px rgba(0,0,0,.6))}
.gv-sprite img{display:block;height:100%;width:auto;object-fit:contain}
.gv-sprite .gv-sprite-lesson{
    position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    font-size:.62em;color:#8b93a5;white-space:nowrap;opacity:.7;
}

/* ---------- 特效层 ---------- */
.gv-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.gv-fx-flash{position:absolute;inset:0;background:#fff;opacity:0}
.gv-fx-flash.go{animation:gvFlash var(--d,420ms) ease-out}
@keyframes gvFlash{0%{opacity:0}18%{opacity:.92}100%{opacity:0}}
.gv-fx-fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity var(--d,600ms) ease}
.gv-fx-fade.go{opacity:1}
.gv-app.shake{animation:gvShake var(--d,420ms) cubic-bezier(.36,.07,.19,.97)}
@keyframes gvShake{
    10%,90%{transform:translate3d(calc(var(--i,6px) * -1),0,0)}
    20%,80%{transform:translate3d(calc(var(--i,6px) * 2),0,0)}
    30%,50%,70%{transform:translate3d(calc(var(--i,6px) * -3),0,0)}
    40%,60%{transform:translate3d(calc(var(--i,6px) * 3),0,0)}
}

/* ---------- 地点提示 ---------- */
.gv-place{
    position:absolute;left:50%;top:7%;transform:translateX(-50%);
    padding:.5em 1.6em;border-radius:99px;font-size:.86em;letter-spacing:.14em;
    background:rgba(8,9,13,.72);border:1px solid rgba(230,199,138,.35);color:#f0e2c6;
    opacity:0;transition:opacity .5s ease,transform .5s ease;pointer-events:none;white-space:nowrap;
    backdrop-filter:blur(8px);z-index:5;
}
.gv-place.on{opacity:1;transform:translateX(-50%) translateY(4px)}

/* ---------- 对话框 ---------- */
.gv-ui{position:absolute;inset:0;pointer-events:none}
.gv-ui > *{pointer-events:auto}
.gv-textbox{
    position:absolute;left:0;right:0;bottom:0;min-height:28%;
    padding:1.4% 5% 3.2%;display:flex;flex-direction:column;justify-content:flex-end;
    background:linear-gradient(to top, rgba(5,6,9,.95) 0%, rgba(5,6,9,.88) 46%, rgba(5,6,9,0) 100%);
    opacity:0;transition:opacity .28s ease;cursor:pointer;
}
.gv-textbox.on{opacity:1}
.gv-textbox.hidden-ui{opacity:0 !important;pointer-events:none}
.gv-name{
    font-size:.96em;font-weight:700;letter-spacing:.05em;margin:0 0 .5em .15em;
    color:var(--gv-accent,#e6c78a);text-shadow:0 2px 12px rgba(0,0,0,.9);
    display:flex;align-items:center;gap:.5em;
}
.gv-name:empty{display:none}
.gv-name::before{content:"";width:.28em;height:.95em;border-radius:2px;background:currentColor;opacity:.85}
.gv-text{
    font-size:1em;line-height:1.95;white-space:pre-wrap;word-break:break-word;
    text-shadow:0 2px 14px rgba(0,0,0,.92);max-width:1180px;min-height:1.95em;
}
.gv-text.narration{color:#d8dbe3;font-style:normal;opacity:.95}
.gv-next{
    position:absolute;right:4.4%;bottom:1.1em;font-size:.8em;color:var(--gv-accent,#e6c78a);
    opacity:0;transition:opacity .2s;
}
.gv-next.on{opacity:.9;animation:gvBounce 1.3s ease-in-out infinite}
@keyframes gvBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

/* 皮肤：方框 */
.gv-skin-box .gv-textbox{
    left:4%;right:4%;bottom:3%;border-radius:14px;min-height:0;
    padding:1.4em 2em 1.6em;background:rgba(10,12,18,.9);
    border:1px solid rgba(230,199,138,.3);box-shadow:0 18px 60px rgba(0,0,0,.6);
    backdrop-filter:blur(10px);
}
/* 皮肤：极简（只有一条线） */
.gv-skin-minimal .gv-textbox{
    background:linear-gradient(to top, rgba(5,6,9,.82), rgba(5,6,9,0) 100%);
    border-top:1px solid rgba(255,255,255,.1);
}
/* 皮肤：玻璃 */
.gv-skin-glass .gv-textbox{
    left:3%;right:3%;bottom:2.4%;border-radius:18px;min-height:0;padding:1.3em 1.9em 1.5em;
    background:rgba(16,20,30,.45);border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 18px 50px rgba(0,0,0,.45);
}

/* ---------- 选项 ---------- */
.gv-choices{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:.68em;padding:6%;background:rgba(4,5,8,.5);backdrop-filter:blur(3px);z-index:6;
}
.gv-choices.on{display:flex;animation:gvFadeIn .24s ease}
@keyframes gvFadeIn{from{opacity:0}to{opacity:1}}
.gv-choice{
    width:min(660px,92%);padding:.9em 1.4em;border-radius:12px;cursor:pointer;
    border:1px solid rgba(230,199,138,.42);background:rgba(16,18,25,.9);color:#f1f2f6;
    font-family:inherit;font-size:.96em;line-height:1.6;text-align:center;
    transition:background .18s ease, border-color .18s ease, transform .18s ease;
    box-shadow:0 8px 28px rgba(0,0,0,.42);text-shadow:0 1px 6px rgba(0,0,0,.6);
}
.gv-choice:hover,.gv-choice:focus-visible{
    background:rgba(230,199,138,.14);border-color:var(--gv-accent,#e6c78a);
    transform:translateY(-1px);outline:none;
}
.gv-choice.locked{opacity:.38;cursor:not-allowed;filter:grayscale(.5)}
.gv-choice .gv-choice-num{opacity:.55;margin-right:.6em;font-size:.85em}

/* ---------- 顶部工具栏 ---------- */
.gv-toolbar{
    position:absolute;top:0;right:0;display:flex;gap:.24em;padding:.62em .72em;z-index:7;
    opacity:.36;transition:opacity .25s ease;
}
.gv-root:hover .gv-toolbar,.gv-toolbar.show{opacity:1}
.gv-toolbar button{
    width:2.15em;height:2.15em;border-radius:9px;cursor:pointer;font-size:.82em;
    border:1px solid rgba(255,255,255,.16);background:rgba(10,12,17,.62);color:#d3d7e0;
    display:grid;place-items:center;backdrop-filter:blur(8px);transition:.16s;
}
.gv-toolbar button:hover{background:rgba(230,199,138,.18);border-color:rgba(230,199,138,.55);color:#fff}
.gv-toolbar svg{width:1.05em;height:1.05em;display:block}
.gv-toolbar button.active{background:rgba(230,199,138,.3);border-color:var(--gv-accent,#e6c78a);color:#fff}

/* ---------- 标题画面 ---------- */
.gv-title{
    position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1.1em;padding:6%;
    background:radial-gradient(70% 70% at 50% 42%, rgba(18,21,30,.55) 0%, rgba(3,4,7,.95) 100%);
    opacity:0;pointer-events:none;transition:opacity .5s ease;
}
.gv-title.on{opacity:1;pointer-events:auto}
.gv-title-cover{
    width:min(420px,72%);aspect-ratio:16/9;border-radius:14px;background-size:cover;background-position:center;
    border:1px solid rgba(230,199,138,.28);box-shadow:0 24px 80px rgba(0,0,0,.7);margin-bottom:.4em;
}
.gv-title-cover:empty,.gv-title-cover.none{display:none}
.gv-title h1{
    margin:0;font-size:2.1em;letter-spacing:.18em;font-weight:700;color:#f4f0e6;
    text-shadow:0 4px 30px rgba(230,199,138,.28);
}
.gv-title .gv-sub{font-size:.86em;letter-spacing:.28em;color:#9aa0b0;text-transform:uppercase}
.gv-title-menu{display:flex;flex-direction:column;gap:.55em;margin-top:.8em;width:min(320px,80%)}
.gv-title-menu button{
    padding:.72em 1em;border-radius:10px;cursor:pointer;font-family:inherit;font-size:.92em;
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#e7e9ef;
    transition:.18s;letter-spacing:.06em;
}
.gv-title-menu button:hover{background:rgba(230,199,138,.16);border-color:rgba(230,199,138,.6);color:#fff}
.gv-title-menu button.primary{background:rgba(230,199,138,.18);border-color:rgba(230,199,138,.62);color:#ffeecd}
.gv-title-menu button:disabled{opacity:.34;cursor:default}
.gv-title-foot{position:absolute;bottom:1.4em;font-size:.72em;color:#5d6474;letter-spacing:.1em}

/* ---------- 弹窗（存读档 / 设置 / 回顾） ---------- */
.gv-modal{
    position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;
    padding:4%;background:rgba(2,3,5,.8);backdrop-filter:blur(4px);
}
.gv-modal.on{display:flex;animation:gvFadeIn .2s ease}
.gv-modal-box{
    width:min(880px,100%);max-height:88%;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#151821,#10131a);border:1px solid #2b3140;
    border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.7);overflow:hidden;
}
.gv-modal-head{
    display:flex;align-items:center;gap:.6em;padding:.9em 1.2em;border-bottom:1px solid #242936;
    font-size:.95em;letter-spacing:.08em;color:#e8dcc2;
}
.gv-modal-head .gv-flex{flex:1}
.gv-modal-x{
    width:2em;height:2em;border-radius:8px;border:1px solid #2f3543;background:transparent;
    color:#9aa1b1;cursor:pointer;display:grid;place-items:center;font-size:.95em;
}
.gv-modal-x:hover{background:#232836;color:#fff}
.gv-modal-body{padding:1.1em 1.2em;overflow:auto;flex:1;font-size:.9em;line-height:1.75}
.gv-modal-foot{padding:.8em 1.2em;border-top:1px solid #242936;display:flex;gap:.6em;justify-content:flex-end}

.gv-saves{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.7em}
.gv-save{
    position:relative;border:1px solid #2b3140;border-radius:12px;overflow:hidden;cursor:pointer;
    background:#0e1117;transition:.18s;text-align:left;color:inherit;font-family:inherit;padding:0;
}
.gv-save:hover{border-color:rgba(230,199,138,.6);transform:translateY(-2px)}
.gv-save-thumb{height:96px;background-size:cover;background-position:center;background-color:#171b24;
    display:flex;align-items:center;justify-content:center;color:#4d5566;font-size:1.4em}
.gv-save-meta{padding:.55em .7em;font-size:.78em;color:#aeb5c4}

        var speaker = isNarr ? '' : (node.char || '');
        st.speaker = speaker;

        textbox.classList.add('on');
        nameEl.textContent = speaker ? charName(speaker) : '';
        nameEl.style.color = speaker ? charColor(speaker) : '';
        textEl.classList.toggle('narration', !!isNarr);
        textbox.classList.toggle('narration', !!isNarr);

        if (speaker && st.sprites[speaker] && node.emo) {
            st.sprites[speaker].emo = node.emo;
            renderSprites(speaker);
        } else {
            renderSprites(speaker);
        }
        if (speaker && node.emo) {
            moodEl.style.background = MOOD[node.emo] || 'transparent';
        } else if (isNarr) {
            moodEl.style.background = 'transparent';
        }

        // 历史
        st.history.push({ name: speaker ? charName(speaker) : '', text: raw, narr: !!isNarr });
        if (st.history.length > 300) st.history.shift();

        // 已读标记
        if (node.id && !seen[node.id]) { seen[node.id] = 1; seenDirty = true; }

        st.pages = splitPages(raw);
        st.page = 0;
        st.pageText = st.pages[0] || '';
        st.typed = 0;
        textEl.textContent = '';
        if (node.voice) playSe(node.voice, 1);
        typeStart();
        autoSaveNow();
        persistSeen();
    }

    /* ---------------- 音频 ---------------- */
    var bgmAudio = null;
    function playBgm(v, loop, vol, fade) {
        if (bgmAudio) { try { bgmAudio.pause(); } catch (e) {} bgmAudio = null; }
        var s = src(v);
        if (!s) return;
        bgmAudio = new Audio(s);
        bgmAudio.loop = loop !== false;
        bgmAudio.volume = clamp((vol == null ? 70 : vol) / 100 * (st.cfg.volume / 100), 0, 1);
        bgmAudio.play().catch(function () { /* 浏览器可能拦截，等用户交互后再试 */ });
    }
    function playSe(v, vol) {
        var s = src(v);
        if (!s) return;
        try {
            var a = new Audio(s);
            a.volume = clamp((vol == null ? 80 : vol) / 100 * (st.cfg.volume / 100), 0, 1);
            a.play().catch(function () {});
        } catch (e) { /* 忽略 */ }
    }

    /* ---------------- 条件与变量 ---------------- */
    function cmpNum(a, b, op) {
        switch (op) {
            case '>': return a > b;
            case '<': return a < b;
            case '>=': return a >= b;
            case '<=': return a <= b;
            case '!=': return a !== b;
            default: return a === b;
        }
    }
    function evalTerm(term) {
        var t = String(term || '').trim();
        if (!t) return true;
        if (t === 'true') return true;
        if (t === 'false') return false;
        // 变量名允许中文（「好感」是最常见的写法），只排除运算符与空白
        var m = t.match(/^([^\s><=!~|&]+)\s*(>=|<=|~=|==|!=|>|<|=)\s*([\s\S]+)$/);
        if (!m) {
            var v = st.vars[t];
            return !(v === undefined || v === null || v === '' || v === 0 || v === '0' || v === false || v === 'false');
        }
        var lhs = st.vars[m[1]];
        var op = m[2] === '=' ? '==' : m[2];
        var rhsRaw = m[3].trim();
        var rhs = parseVal(rhsRaw);
        if (op === '~=') return String(lhs == null ? '' : lhs).indexOf(String(rhs)) >= 0;
        var ln = Number(lhs), rn = Number(rhs);
        if (lhs !== '' && lhs != null && rhs !== '' && !isNaN(ln) && !isNaN(rn)) {
            return cmpNum(ln, rn, op);
        }
        if (op === '==') return String(lhs == null ? '' : lhs) === String(rhs == null ? '' : rhs);
        if (op === '!=') return String(lhs == null ? '' : lhs) !== String(rhs == null ? '' : rhs);
        return cmpNum(String(lhs == null ? '' : lhs), String(rhs == null ? '' : rhs), op);
    }
    function evalCond(expr) {
        var s = String(expr == null ? '' : expr).trim();
        if (!s) return true;
        var ors = s.split('||');
        for (var i = 0; i < ors.length; i++) {
            var ands = ors[i].split('&&');
            var ok = true;
            for (var j = 0; j < ands.length; j++) {
                if (!evalTerm(ands[j])) { ok = false; break; }
            }
            if (ok) return true;
        }
        return false;
    }
    function applySet(name, op, rawVal) {
        if (!name) return;
        var v = parseVal(rawVal);
        var cur = st.vars[name];
        switch (op) {
            case 'add': st.vars[name] = Number(cur || 0) + Number(v || 0); break;
            case 'sub': st.vars[name] = Number(cur || 0) - Number(v || 0); break;
            case 'mul': st.vars[name] = Number(cur || 0) * Number(v || 1); break;
            case 'append': st.vars[name] = String(cur == null ? '' : cur) + String(v == null ? '' : v); break;
            case 'toggle': st.vars[name] = !st.vars[name]; break;
            default: st.vars[name] = v;
        }
    }

    /* ---------------- 索引 ---------------- */
    var idIndex = {};
    var labelIndex = {};
    NODES.forEach(function (n, i) {
        if (!n) return;
        if (n.id) idIndex[n.id] = i;
        if (n.type === 'label' && n.name) labelIndex[n.name] = i;
    });

    function resolveTarget(t) {
        if (t == null || t === '') return -1;
        if (typeof t === 'number') return t;
        if (idIndex[t] != null) return idIndex[t];
        if (labelIndex[t] != null) return labelIndex[t];
        return -1;
    }

    /* ---------------- 结局 ---------------- */
    var END_KIND = {
        good: 'GOOD END', bad: 'BAD END', true: 'TRUE END',
        normal: 'NORMAL END', any: 'END'
    };
    function showEnd(node) {
        st.ended = true;
        st.typing = false;
        clearInterval(typeTimer);
        clearTimeout(autoTimer);
        textbox.classList.remove('on');
        choicesEl.classList.remove('on');
        toolbar.style.display = 'none';
        endEl.innerHTML = '';
        var kind = el('div', 'gv-end-kind', END_KIND[node.kind] || 'END');
        var h = el('h2', null, node.title || '完');
        endEl.appendChild(kind);
        endEl.appendChild(h);
        if (node.text) endEl.appendChild(el('p', null, node.text));
        var menu = el('div', 'gv-end-menu');
        var b1 = el('button', null, '回到标题');
        b1.onclick = function () { endEl.classList.remove('on'); showTitle(); };
        var b2 = el('button', null, '读取存档');
        b2.onclick = function () { openLoad(); };
        menu.appendChild(b1);
        menu.appendChild(b2);
        endEl.appendChild(menu);
        endEl.classList.add('on');
    }

    /* ---------------- 主循环 ---------------- */
    function step() {
        if (st.pc < 0 || st.pc >= NODES.length) {
            showEnd({ title: '完', text: '', kind: 'any' });
            return;
        }
        var guard = 0;
        while (st.pc >= 0 && st.pc < NODES.length) {
            if (guard++ > 4000) { toast('剧本可能有死循环'); break; }
            var n = NODES[st.pc];
            if (!n) { st.pc++; continue; }
            var r = exec(n);
            if (r === 'stop') return;
            if (r === 'next') { st.pc++; continue; }
            if (r === 'moved') continue;
            break;
        }
        if (st.pc >= NODES.length) {
            showEnd({ title: '完', text: '', kind: 'any' });
        }
    }

    function exec(n) {
        switch (n.type) {
            case 'label':
                return 'next';
            case 'say':
                showLine(n, false);
                return 'stop';
            case 'narrate':
                showLine(n, true);
                return 'stop';
            case 'bg': {
                setBg(n.src, n.transition || 'fade', n.kenBurns !== false);
                if (n.place) showPlace(n.place);
                return 'next';
            }
            case 'show': {
                if (!n.char) return 'next';
                if (!st.sprites[n.char]) st.sprites[n.char] = { emo: n.emo || 'default', pos: n.pos || 'center' };
                else {
                    if (n.emo) st.sprites[n.char].emo = n.emo;
                    if (n.pos) st.sprites[n.char].pos = n.pos;
                }
                renderSprites(st.speaker);
                return 'next';
            }
            case 'hide': {
                if (n.char === 'all' || !n.char) {
                    Object.keys(st.sprites).forEach(function (cid) {
                        var b = spriteEls[cid];
                        if (b) { b.classList.remove('on'); (function (bb) { setTimeout(function () { if (bb && bb.parentNode) bb.parentNode.removeChild(bb); }, 420); })(b); }
                        delete spriteEls[cid]; delete spriteBox[cid];
                    });
                    st.sprites = {};
                } else {
                    delete st.sprites[n.char];
                    var box = spriteEls[n.char];
                    if (box) {
                        box.classList.remove('on');
                        (function (bb) { setTimeout(function () { if (bb && bb.parentNode) bb.parentNode.removeChild(bb); }, 420); })(box);
                        delete spriteEls[n.char];
                        delete spriteBox[n.char];
                    }
                    renderSprites(st.speaker);
                }
                return 'next';
            }
            case 'choice': {
                renderChoices(n);
                return 'stop';
            }
            case 'jump': {
                var ti = resolveTarget(n.target);
                // 目标没填 / 已被删：静默跳过，别在玩家面前弹错误（编辑器有断链检查）
                if (ti < 0) return 'next';
                st.pc = ti;
                return 'moved';
            }
            case 'if': {
                if (evalCond(n.cond)) {
                    var a = resolveTarget(n.then);
                    if (a >= 0) { st.pc = a; return 'moved'; }
                } else {
                    var b = resolveTarget(n.else);
                    if (b >= 0) { st.pc = b; return 'moved'; }
                }
                return 'next';
            }
            case 'set': {
                applySet(n.name, n.op || 'set', n.value);
                return 'next';
            }
            case 'sound': {
                if (n.channel === 'se') {
                    if (n.action !== 'stop') playSe(n.src, n.volume);
                } else {
                    if (n.action === 'stop') playBgm('', false, 0);
                    else playBgm(n.src, n.loop !== false, n.volume);
                }
                return 'next';
            }
            case 'fx': {
                doFx(n);
                return 'next';
            }
            case 'wait': {
                var ms = Math.max(0, Number(n.ms) || 600);
                setTimeout(function () { st.pc++; step(); }, ms);
                return 'stop';
            }
            case 'end':
                showEnd(n);
                return 'stop';
            default:
                return 'next';
        }
    }

    function doFx(n) {
        var kind = n.kind || 'shake';
        var dur = Math.max(80, Number(n.duration) || 420);
        var intensity = Number(n.intensity) || 1;
        if (kind === 'shake') {
            app.style.setProperty('--d', dur + 'ms');
            app.style.setProperty('--i', Math.round(6 * intensity) + 'px');
            app.classList.remove('shake');
            void app.offsetWidth;
            app.classList.add('shake');
            setTimeout(function () { app.classList.remove('shake'); }, dur + 60);
        } else if (kind === 'flash') {
            flashEl.style.setProperty('--d', dur + 'ms');
            flashEl.classList.remove('go');
            void flashEl.offsetWidth;
            flashEl.classList.add('go');
        } else if (kind === 'fadeout' || kind === 'fadein') {
            fadeEl.style.setProperty('--d', dur + 'ms');
            if (kind === 'fadeout') fadeEl.classList.add('go');
            else fadeEl.classList.remove('go');
        }
    }

    /* ---------------- 选项 ---------------- */
    function renderChoices(n) {
        st.curNode = n;
        choicesEl.innerHTML = '';
        var list = (n.choices || []).filter(function (c) { return c && c.text; });
        if (n.prompt) {
            var p = el('div', 'gv-choice-prompt');
            p.textContent = n.prompt;
            p.style.cssText = 'color:#e9dcc0;font-size:.92em;letter-spacing:.06em;margin-bottom:.4em;text-shadow:0 2px 10px #000';
            choicesEl.appendChild(p);
        }
        var shown = 0;
        var chose = 0;
        list.forEach(function (c, i) {
            var ok = evalCond(c.cond);
            if (!ok && n.hideLocked) return;
            chose++;
            var btn = el('button', 'gv-choice');
            btn.type = 'button';
            var num = el('span', 'gv-choice-num', String(shown + 1));
            btn.appendChild(num);
            btn.appendChild(document.createTextNode(c.text));
            if (!ok) {
                btn.classList.add('locked');
                btn.disabled = true;
            }
            btn.onclick = function () {
                if (!ok) return;
                (c.effects || []).forEach(function (e) { applySet(e.name, e.op || 'set', e.value); });
                var t = resolveTarget(c.target);
                if (t < 0) t = st.pc + 1;
                choicesEl.classList.remove('on');
                choicesEl.innerHTML = '';
                st.pc = t;
                st.ended = false;
                step();
            };
            choicesEl.appendChild(btn);
            shown++;
        });
        // 全部锁定 = 死局，给一个「继续」兜底，免得玩家卡在这里
        if (!chose) {
            var esc = el('button', 'gv-choice', '继续');
            esc.type = 'button';
            esc.onclick = function () {
                choicesEl.classList.remove('on');
                choicesEl.innerHTML = '';
                st.pc++;
                step();
            };
            choicesEl.appendChild(esc);
        }
        choicesEl.classList.add('on');
        if (st.auto) { st.auto = false; syncToolbar(); }
        if (st.skip) { st.skip = false; syncToolbar(); }
    }

    /* ---------------- 推进 ---------------- */
    function advance() {
        if (modal.classList.contains('on')) return;
        if (endEl.classList.contains('on')) return;
        if (choicesEl.classList.contains('on')) return;
        if (!st.started) return;
        if (st.typing) {
            // 立刻显示本页全文
            clearInterval(typeTimer);
            st.typed = st.pageText.length;
            textEl.textContent = st.pageText;
            st.typing = false;
            var isLast = st.page >= st.pages.length - 1;
            nextEl.classList.toggle('on', isLast);
            if (st.auto || st.skip) scheduleNext();
            return;
        }
        if (st.page < st.pages.length - 1) {
            st.page++;
            st.pageText = st.pages[st.page];
            st.typed = 0;
            textEl.textContent = '';
            typeStart();
            return;
        }
        clearTimeout(autoTimer);
        st.pc++;
        step();
    }

    /* ---------------- 存档 ---------------- */
    function snapshot() {
        return {
            pc: st.pc,
            vars: JSON.parse(JSON.stringify(st.vars)),
            bg: st.bg,
            sprites: JSON.parse(JSON.stringify(st.sprites)),
            history: st.history.slice(-120),
            speaker: st.speaker,
            text: (st.curNode && st.curNode.text) || '',
            name: st.curNode && st.curNode.char ? charName(st.curNode.char) : '',
            time: Date.now(),
            chapter: currentChapter()
        };
    }
    function currentChapter() {
        for (var i = Math.min(st.pc, NODES.length - 1); i >= 0; i--) {
            if (NODES[i] && NODES[i].type === 'label' && (NODES[i].chapter || NODES[i].name)) {
                return NODES[i].chapter || NODES[i].name;
            }
        }
        return D.title || '';
    }

    /* 自动存档 / 已读记录：都做防抖，避免每句都写一次 localStorage */
    var autoSaveTimer = null;
    function autoSaveNow() {
        clearTimeout(autoSaveTimer);
        autoSaveTimer = setTimeout(function () {
            if (st.started && !st.ended) {
                try { localStorage.setItem(SAVE_PREFIX + AUTO_SLOT, JSON.stringify(snapshot())); } catch (e) { /* 忽略 */ }
            }
        }, 400);
    }
    var seenTimer = null;
    function persistSeen() {
        if (!seenDirty) return;
        clearTimeout(seenTimer);
        seenTimer = setTimeout(function () {
            try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); seenDirty = false; } catch (e) { /* 忽略 */ }
        }, 1200);
    }
    function doSave(slot) {
        try {
            localStorage.setItem(SAVE_PREFIX + slot, JSON.stringify(snapshot()));
            return true;
        } catch (e) {
            toast('存档失败：浏览器存储空间不足');
            return false;
        }
    }
    function readSave(slot) {
        try {
            var raw = localStorage.getItem(SAVE_PREFIX + slot);
            return raw ? JSON.parse(raw) : null;
        } catch (e) { return null; }
    }
    function restore(save) {
        if (!save) return;
        st.pc = save.pc || 0;
        st.vars = save.vars || {};
        st.sprites = save.sprites || {};
        st.history = save.history || [];
        st.ended = false;
        st.typing = false;
        st.auto = false;
        st.skip = false;
        clearInterval(typeTimer);
        clearTimeout(autoTimer);
        titleEl.classList.remove('on');
        endEl.classList.remove('on');
        modal.classList.remove('on');
        toolbar.style.display = '';
        choicesEl.classList.remove('on');
        choicesEl.innerHTML = '';
        spriteEls = {};
        spritesEl.innerHTML = '';
        setBg(save.bg || '', 'cut', false);
        st.started = true;
        // 重新执行当前节点：say / narrate 会重新显示这一句
        var n = NODES[st.pc];
        if (n && (n.type === 'say' || n.type === 'narrate')) {
            // 存的历史里已经含这一句，重放时会再 push 一次，先去掉末尾重复项
            var h = st.history[st.history.length - 1];
            if (h && h.text === String(n.text || '')) st.history.pop();
            renderSprites(n.char || '');
            showLine(n, n.type === 'narrate');
        } else {
            renderSprites('');
            step();
        }
        syncToolbar();
    }

    /* ---------------- 标题画面 ---------------- */
    function showTitle() {
        st.started = false;
        st.ended = false;
        st.typing = false;
        st.auto = false;
        st.skip = false;
        clearInterval(typeTimer);
        clearTimeout(autoTimer);
        textbox.classList.remove('on');
        choicesEl.classList.remove('on');
        choicesEl.innerHTML = '';
        endEl.classList.remove('on');
        modal.classList.remove('on');
        st.sprites = {};
        spritesEl.innerHTML = '';
        spriteEls = {};
        setBg(CFG.cover || '', 'cut', false);

        titleEl.innerHTML = '';
        if (CFG.cover) {
            var cover = el('div', 'gv-title-cover');
            cover.style.backgroundImage = cssUrl(CFG.cover);
            titleEl.appendChild(cover);
        }
        var h = el('h1', null, D.title || '未命名作品');
        titleEl.appendChild(h);
        if (CFG.subtitle) titleEl.appendChild(el('div', 'gv-sub', CFG.subtitle));

        var menu = el('div', 'gv-title-menu');
        var hasAuto = !!readSave(AUTO_SLOT);
        var bStart = el('button', 'primary', hasAuto ? '重新开始' : '开始游戏');
        bStart.onclick = function () { startNew(); };
        menu.appendChild(bStart);
        if (hasAuto) {
            var bCont = el('button', null, '继续游戏');
            bCont.onclick = function () { restore(readSave(AUTO_SLOT)); };
            menu.appendChild(bCont);
        }
        var bLoad = el('button', null, '读取存档');
        bLoad.onclick = function () { openLoad(); };
        var bCfg = el('button', null, '设置');
        bCfg.onclick = function () { openConfig(); };
        menu.appendChild(bLoad);
        menu.appendChild(bCfg);
        titleEl.appendChild(menu);
        titleEl.appendChild(el('div', 'gv-title-foot', (D.author ? D.author + ' · ' : '') + 'Powered by My SW GAL'));
        titleEl.classList.add('on');
        toolbar.style.display = 'none';
        syncToolbar();
    }

    function startNew() {
        st.pc = 0;
        st.vars = {};
        (D.vars || []).forEach(function (v) {
            if (v && v.name) st.vars[v.name] = parseVal(v.value);
        });
        st.history = [];
        st.sprites = {};
        st.bg = '';
        st.ended = false;
        st.started = true;
        spriteEls = {};
        spritesEl.innerHTML = '';
        titleEl.classList.remove('on');
        endEl.classList.remove('on');
        modal.classList.remove('on');
        toolbar.style.display = '';
        setBg('', 'cut', false);
        var start = CFG.startLabel ? resolveTarget(CFG.startLabel) : 0;
        if (start < 0) start = 0;
        st.pc = start;
        step();
        syncToolbar();
    }

    /* ---------------- 弹窗 ---------------- */
    function openModal(title) {
        modalTitle.textContent = title;
        modalBody.innerHTML = '';
        modalFoot.innerHTML = '';
        modal.classList.add('on');
    }
    function closeModal() { modal.classList.remove('on'); }

    function fmtTime(t) {
        if (!t) return '';
        var d = new Date(t);
        function p(n) { return n < 10 ? '0' + n : '' + n; }
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
            p(d.getHours()) + ':' + p(d.getMinutes());
    }

    function renderSaveGrid(mode) {
        // 每次重画都从干净的面板开始，否则点一次存档就会多出一组格子
        modalBody.innerHTML = '';
        var grid = el('div', 'gv-saves');
        for (var i = 1; i <= SLOTS; i++) {
            (function (i) {
                var sv = readSave(i);
                var cell = el('button', 'gv-save' + (sv ? '' : ' empty'));
                cell.type = 'button';
                var thumb = el('div', 'gv-save-thumb');
                if (sv && sv.bg) {
                    thumb.style.backgroundImage = cssUrl(sv.bg);
                } else if (sv) {
                    thumb.textContent = sv.chapter || D.title || '';
                    thumb.style.fontSize = '.74em';
                    thumb.style.color = '#7c8699';
                    thumb.style.letterSpacing = '.1em';
                } else {
                    thumb.textContent = '空';
                }
                cell.appendChild(thumb);
                var meta = el('div', 'gv-save-meta');
                var b = el('b', null, '存档 ' + i);
                meta.appendChild(b);
                if (sv) {
                    meta.appendChild(document.createTextNode((sv.chapter ? sv.chapter + ' · ' : '') + (sv.name ? sv.name + '：' : '')));
                    var t = el('small', null, (sv.text || '').slice(0, 26) + ((sv.text || '').length > 26 ? '…' : ''));
                    meta.appendChild(t);
                    var t2 = el('small', null, fmtTime(sv.time));
                    meta.appendChild(t2);
                } else {
                    meta.appendChild(el('small', null, mode === 'save' ? '点这里保存' : '没有记录'));
                }
                cell.appendChild(meta);
                cell.onclick = function () {
                    if (mode === 'save') {
                        if (!st.started) { toast('还没开始游戏'); return; }
                        if (doSave(i)) { toast('已存到存档 ' + i); renderSaveGrid('save'); }
                    } else {
                        if (!sv) return;
                        restore(sv);
                        toast('已读取存档 ' + i);
                    }
                };
                if (sv) {
                    var del = el('button', 'gv-save-del', '✕');
                    del.type = 'button';
                    del.onclick = function (ev) {
                        ev.stopPropagation();
                        try { localStorage.removeItem(SAVE_PREFIX + i); } catch (e) {}
                        renderSaveGrid(mode);
                    };
                    cell.appendChild(del);
                }
                grid.appendChild(cell);
            })(i);
        }
        modalBody.appendChild(grid);
    }

    function openSave() {
        openModal('存档');
        renderSaveGrid('save');
    }
    function openLoad() {
        openModal('读档');
        renderSaveGrid('load');
        var foot = modalFoot;
        var b = el('button', 'gv-modal-x', '关闭');
        b.style.width = 'auto';
        b.style.padding = '0 14px';
        b.onclick = closeModal;
        foot.appendChild(b);
    }

    function openLog() {
        openModal('回顾');
        var box = el('div', 'gv-log');
        if (!st.history.length) box.appendChild(el('div', 'gv-empty', '还没有已读的对话'));
        st.history.forEach(function (h) {
            var item = el('div', 'gv-log-item' + (h.narr ? ' narr' : ''));
            if (h.name) item.appendChild(el('div', 'gv-log-name', h.name));
            item.appendChild(el('div', 'gv-log-text', h.text));
            box.appendChild(item);
        });
        modalBody.appendChild(box);
        requestAnimationFrame(function () { box.scrollTop = box.scrollHeight; });
    }

    function openConfig() {
        openModal('设置');
        var body = modalBody;

        function rangeRow(label, hint, key, min, max, step, fmt) {
            var row = el('div', 'gv-row');
            var lab = el('div', 'gv-row-label');
            lab.appendChild(document.createTextNode(label));
            if (hint) lab.appendChild(el('small', null, hint));
            var val = el('span', 'gv-val', fmt(st.cfg[key]));
            var input = el('input');
            input.type = 'range';
            input.min = min; input.max = max; input.step = step || 1;
            input.value = st.cfg[key];
            input.oninput = function () {
                st.cfg[key] = Number(input.value);
                val.textContent = fmt(st.cfg[key]);
                saveCfg();
                if (key === 'volume' && bgmAudio) {
                    bgmAudio.volume = clamp((st.cfg.volume / 100), 0, 1);
                }
            };
            row.appendChild(lab); row.appendChild(input); row.appendChild(val);
            body.appendChild(row);
        }

        rangeRow('文字速度', '越大越快，100 为瞬间全出', 'speed', 0, 100, 1, function (v) { return v >= 100 ? '瞬间' : v + ''; });
        rangeRow('自动播放等待', '一句读完后停留的时间', 'autoDelay', 300, 5000, 100, function (v) { return (v / 1000).toFixed(1) + 's'; });
        rangeRow('音量', '背景音乐与音效', 'volume', 0, 100, 1, function (v) { return v + '%'; });

        function checkRow(label, hint, key, onChange) {
            var row = el('div', 'gv-row');
            var lab = el('div', 'gv-row-label');
            lab.appendChild(document.createTextNode(label));
            if (hint) lab.appendChild(el('small', null, hint));
            var sw = el('button', 'gv-switch' + (st.cfg[key] ? ' on' : ''));
            sw.type = 'button';
            sw.onclick = function () {
                st.cfg[key] = !st.cfg[key];
                sw.classList.toggle('on', !!st.cfg[key]);
                saveCfg();
                if (onChange) onChange(st.cfg[key]);
            };
            row.appendChild(lab); row.appendChild(sw);
            body.appendChild(row);
        }
        checkRow('快进时跳过未读', '关掉后只会跳过读过的句子', 'skipUnread');

        var actions = el('div', 'gv-row');
        var lab = el('div', 'gv-row-label');
        lab.appendChild(document.createTextNode('其他'));
        var btn = el('button', 'gv-modal-x', '清除已读记录');
        btn.style.width = 'auto'; btn.style.padding = '0 12px';
        btn.onclick = function () {
            try { localStorage.removeItem(SEEN_KEY); } catch (e) {}
            seen = {};
            toast('已清除');
        };
        actions.appendChild(lab); actions.appendChild(btn);
        body.appendChild(actions);

        var foot = modalFoot;
        var ok = el('button', 'gv-modal-x', '完成');
        ok.style.width = 'auto'; ok.style.padding = '0 16px';
        ok.onclick = closeModal;
        foot.appendChild(ok);
    }

    /* ---------------- 工具栏 ---------------- */
    function syncToolbar() {
        var autoBtn = toolbar.querySelector('[data-act="auto"]');
        var skipBtn = toolbar.querySelector('[data-act="skip"]');
        if (autoBtn) autoBtn.classList.toggle('active', st.auto);
        if (skipBtn) skipBtn.classList.toggle('active', st.skip);
    }

    toolbar.addEventListener('click', function (ev) {
        var b = ev.target.closest ? ev.target.closest('button') : null;
        if (!b) return;
        ev.stopPropagation();
        var act = b.getAttribute('data-act');
        if (act === 'auto') {
            st.auto = !st.auto;
            if (st.auto) { st.skip = false; if (!st.typing) scheduleNext(); }
            else clearTimeout(autoTimer);
            syncToolbar();
        } else if (act === 'skip') {
            st.skip = !st.skip;
            if (st.skip) { st.auto = false; if (!st.typing) scheduleNext(); }
            else clearTimeout(autoTimer);
            syncToolbar();
        } else if (act === 'log') openLog();
        else if (act === 'save') openSave();
        else if (act === 'load') openLoad();
        else if (act === 'config') openConfig();
        else if (act === 'title') showTitle();
        else if (act === 'full') toggleFull();
    });

    function toggleFull() {
        try {
            if (!document.fullscreenElement) {
                var p = document.documentElement.requestFullscreen();
                if (p && p.catch) p.catch(function () {});
            } else {
                document.exitFullscreen();
            }
        } catch (e) { toast('此浏览器不支持全屏'); }
    }

    /* ---------------- 事件 ---------------- */
    textbox.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (choicesEl.classList.contains('on')) return;
        advance();
    });
    app.addEventListener('click', function (ev) {
        if (ev.target.closest && ev.target.closest('.gv-toolbar')) return;
        if (ev.target.closest && ev.target.closest('.gv-modal')) return;
        if (ev.target.closest && ev.target.closest('.gv-title')) return;
        if (ev.target.closest && ev.target.closest('.gv-end')) return;
        if (ev.target.closest && (ev.target.closest('.gv-textbox') || ev.target.closest('.gv-choices'))) return;
        if (!st.started) return;
        advance();
    });

    modal.addEventListener('click', function (ev) {
        if (ev.target === modal) closeModal();
        var b = ev.target.closest ? ev.target.closest('[data-act="close"]') : null;
        if (b) closeModal();
    });

    document.addEventListener('keydown', function (ev) {
        var k = ev.key;
        if (k === 'Escape') {
            if (modal.classList.contains('on')) { closeModal(); ev.preventDefault(); return; }
            if (endEl.classList.contains('on')) { showTitle(); return; }
            openConfig();
            return;
        }
        if (k === ' ' || k === 'Enter' || k === 'ArrowRight' || k === 'PageDown') {
            if (modal.classList.contains('on')) return;
            ev.preventDefault();
            advance();
        } else if (k === 'ArrowDown') {
            if (modal.classList.contains('on')) return;
            ev.preventDefault();
            advance();
        } else if (k === 'a' || k === 'A') {
            st.auto = !st.auto; st.skip = false;
            if (st.auto && !st.typing) scheduleNext();
            syncToolbar();
        } else if (k === 'l' || k === 'L') {
            openLog();
        } else if (k === 'h' || k === 'H') {
            textbox.classList.toggle('hidden-ui');
        } else if (k === 'Control') {
            if (!st.skip) { st.skip = true; if (st.typing) { textEl.textContent = st.pageText; st.typed = st.pageText.length; clearInterval(typeTimer); st.typing = false; } scheduleNext(); syncToolbar(); }
        }
    });
    document.addEventListener('keyup', function (ev) {
        if (ev.key === 'Control' && st.skip) {
            st.skip = false;
            clearTimeout(autoTimer);
            syncToolbar();
        }
    });

    window.addEventListener('resize', fitScale);
    window.addEventListener('orientationchange', function () { setTimeout(fitScale, 120); });
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            clearTimeout(autoTimer);
            clearInterval(typeTimer);
        } else if (st.started && !st.typing && (st.auto || st.skip)) {
            scheduleNext();
        }
    });

    window.addEventListener('beforeunload', function () {
        if (seenDirty) {
            try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) { /* 忽略 */ }
            seenDirty = false;
        }
    });

    /* ---------------- 启动 ---------------- */
    loadCfg();

    var qs = new URLSearchParams(location.search);
    // ?start=<节点id> 优先，其次是导出时写入 settings.startAt（试玩用，blob URL 读 query 不可靠）
    var startId = qs.get('start') || CFG.startAt || '';
    var noTitle = qs.get('notitle') === '1';

    if (startId) {
        st.vars = {};
        (D.vars || []).forEach(function (v) { if (v && v.name) st.vars[v.name] = parseVal(v.value); });
        var idx = resolveTarget(startId);
        st.started = true;
        st.pc = idx >= 0 ? idx : 0;
        // 先把 start 之前的背景/立绘状态跑一遍（不显示台词）
        fastForwardTo(st.pc);
        st.pc = idx >= 0 ? idx : 0;
        step();
    } else if (noTitle) {
        startNew();
    } else {
        showTitle();
    }

    /* 静默执行 start 之前的指令节点，让试玩时背景/立绘状态正确 */
    function fastForwardTo(target) {
        st.pc = 0;
        var guard = 0;
        while (st.pc < target && guard++ < 4000) {
            var n = NODES[st.pc];
            if (!n) { st.pc++; continue; }
            if (n.type === 'bg') { setBg(n.src, 'cut', false); st.pc++; continue; }
            if (n.type === 'show') {
                if (n.char) st.sprites[n.char] = { emo: n.emo || 'default', pos: n.pos || 'center' };
                st.pc++; continue;
            }
            if (n.type === 'hide') {
                if (n.char === 'all' || !n.char) st.sprites = {};
                else delete st.sprites[n.char];
                st.pc++; continue;
            }
            if (n.type === 'set') { applySet(n.name, n.op || 'set', n.value); st.pc++; continue; }
            if (n.type === 'say' || n.type === 'narrate') {
                if (n.char && n.emo && st.sprites[n.char]) st.sprites[n.char].emo = n.emo;
                st.pc++; continue;
            }
            if (n.type === 'jump') {
                var t = resolveTarget(n.target);
                if (t >= 0) {
                    if (t >= target) break;
                    st.pc = t; continue;
                }
                st.pc++; continue;
            }
            if (n.type === 'if') {
                var tt = resolveTarget(evalCond(n.cond) ? n.then : n.else);
                if (tt >= 0) {
                    if (tt >= target) break;
                    st.pc = tt; continue;
                }
                st.pc++; continue;
            }
            // 遇到选项无法预判玩家会选哪条，停在这里
            if (n.type === 'choice') break;
            st.pc++;
        }
        renderSprites('');
    }

    /* 让编辑器能读/写内存里的状态（仅调试用，不影响成品） */
    try {
        window.GalPlayer = {
            state: st,
            nodes: NODES,
            goto: function (i) { st.pc = i; step(); },
            startNew: startNew,
            showTitle: showTitle
        };
    } catch (e) {}
})();
</script>

<script src="api-protocol.js"></script>
<script src="gal-library.js"></script>
<script src="gal-ai.js"></script>
<script src="gal.js"></script>
